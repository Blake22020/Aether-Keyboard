name: Release APK

# Релиз создаётся при пуше тега (git tag v11.1.1 && git push --tags)
# или вручную во вкладке Actions — тогда тег будет v11.1.<номер запуска>.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Android setup
        uses: ./.github/actions/android-setup

      - name: Build Release and Debug APK
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v11.1.{0}', github.run_number) }}
          name: Aether Keyboard ${{ github.ref_type == 'tag' && github.ref_name || format('11.1 (build {0})', github.run_number) }}
          body: |
            Aether Keyboard — independent fork. APK built from this GitHub Actions run.
            app-debug.apk — отладочная (ставится рядом как отдельное приложение).
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
