name: Aether G patch-source verification

on:
  push:
    branches: [ "feature/aether-g" ]
    paths:
      - 'aether-g/**'
      - '.github/workflows/aether-g-patches.yml'
  pull_request:
    paths:
      - 'aether-g/**'
      - '.github/workflows/aether-g-patches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Compile and test Aether G patch source
        run: bash aether-g/patches.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aether-g-experimental-patches
          path: aether-g/worktree/PixelBoard/pixelboard-patches/patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
